<svg xmlns="http://www.w3.org/2000/svg" width="700" height="134" viewBox="0 0 700 134" role="img" aria-labelledby="t"><title id="t">Think deep, don't sink. If you don't know how, observe the phenomena of nature, they will give you clear answers and inspiration.</title><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8ee7d1"/><stop offset="1" stop-color="#3fb68b"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111b24"/><stop offset="1" stop-color="#17152d"/></linearGradient></defs><style>.k{font:700 22px ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;fill:#d9fff1}.s{font:500 15px ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;fill:#aeb9cc}.b{animation:p 4s ease-in-out infinite}@keyframes p{50%{opacity:.55}}@media (prefers-reduced-motion:reduce){.b{animation:none}}</style><rect x=".5" y=".5" width="699" height="133" rx="16" fill="url(#bg)" stroke="#2a3a4a"/><rect class="b" x="18" y="18" width="6" height="98" rx="3" fill="url(#g)"/><text class="k" x="46" y="52">Think deep, don't sink.</text><text class="s" x="46" y="82">If you don't know how, observe the phenomena of nature,</text><text class="s" x="46" y="104">they will give you clear answers and inspiration.</text></svg>